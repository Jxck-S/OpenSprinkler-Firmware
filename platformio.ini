; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = .
include_dir = .

[env:os3x_esp8266]
platform = espressif8266@4.2.1
board = d1_mini
framework = arduino
extra_scripts = pre:run_prebuild.py
lib_ldf_mode = deep
lib_deps =
	https://github.com/ThingPulse/esp8266-oled-ssd1306/archive/4.2.0.zip
	knolleary/PubSubClient @ ^2.8
	symlink://external/OpenThings-Framework-Firmware-Library
	;https://github.com/OpenThingsIO/OpenThings-Framework-Firmware-Library @ ^0.2.0
; ignore html2raw.cpp source file for firmware compilation (external helper program)
build_src_filter = +<*> +<api/*> +<boards/*> +<core/*> +<drivers/*> +<platform/*> +<sensors/*> +<services/*> +<storage/*> +<util/*> -<html/*> -<tests/*> --<external/*>
upload_speed = 460800
monitor_speed = 115200
board_build.flash_mode = dio
board_build.ldscript = eagle.flash.4m2m.ld
board_build.f_cpu = 160000000L
board_build.f_flash = 80000000L
;build_flags = -DENABLE_DEBUG

; OpenSprinkler v4.0 uses an ESP32-C6 and Arduino-ESP32 Core 3. The platform
; release is pinned so firmware builds do not change with upstream updates.
[env:os4_esp32c6_n8]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
extra_scripts = pre:run_prebuild.py
lib_ldf_mode = deep
lib_deps =
	https://github.com/ThingPulse/esp8266-oled-ssd1306/archive/4.2.0.zip
	knolleary/PubSubClient @ ^2.8
	symlink://external/OpenThings-Framework-Firmware-Library
build_src_filter = +<*> +<api/*> +<boards/*> +<core/*> +<drivers/*> +<platform/*> +<sensors/*> +<services/*> +<storage/*> +<util/*> -<html/*> -<tests/*> --<external/*>
board_build.partitions = os4_n8.csv
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
upload_speed = 460800
monitor_speed = 115200
build_flags =
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	-DOS4_FLASH_N8=1

; Community builds for classic ESP32 boards with an RMII Ethernet PHY such as
; the LAN8720. Each env only sets the board's pins; see docs/esp32-lan8720.md
; and boards/rmii_config.h for every option and its default.
[esp32_rmii]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32dev
framework = arduino
extra_scripts = pre:run_prebuild.py
lib_ldf_mode = deep
lib_deps =
	https://github.com/ThingPulse/esp8266-oled-ssd1306/archive/4.2.0.zip
	knolleary/PubSubClient @ ^2.8
	symlink://external/OpenThings-Framework-Firmware-Library
build_src_filter = +<*> +<api/*> +<boards/*> +<core/*> +<drivers/*> +<platform/*> +<sensors/*> +<services/*> +<storage/*> +<util/*> -<html/*> -<tests/*> --<external/*>
board_build.partitions = os_4mb.csv
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
upload_speed = 460800
monitor_speed = 115200
build_flags =
	-DOS_ETH_RMII=1

; WT32-ETH01: LAN8720 at address 1, oscillator enabled by GPIO16, clock into GPIO0.
[env:esp32_lan8720_wt32_eth01]
extends = esp32_rmii
build_flags =
	${esp32_rmii.build_flags}
	-DOS_ETH_PHY_ADDR=1
	-DOS_ETH_PHY_POWER=16
	-DOS_ETH_CLK_MODE=ETH_CLOCK_GPIO0_IN
	-DOS_I2C_SDA=33
	-DOS_I2C_SCL=32
	-DOS_GPIO_FREE_PINS=4,5,14,15,17

; ESP32 dev board + LAN8720 module with its 50 MHz clock wired to GPIO0. Set
; OS_ETH_PHY_POWER if a GPIO gates the module's oscillator.
[env:esp32_lan8720_generic]
extends = esp32_rmii
build_flags =
	${esp32_rmii.build_flags}
	-DOS_ETH_PHY_ADDR=1
	-DOS_ETH_PHY_POWER=-1
	-DOS_ETH_CLK_MODE=ETH_CLOCK_GPIO0_IN
	-DOS_I2C_SDA=33
	-DOS_I2C_SCL=32
	-DOS_GPIO_FREE_PINS=4,5,13,14,15

; The following env is for syntax highlighting only,
; it is NOT for building the firmware for Linux.
; To build the firmware for Linux, please follow:
; https://openthings.freshdesk.com/support/solutions/articles/5000631599
[env:linux]
platform = native
build_flags =
	${env.build_flags}
	-DOSPI

; The following env is for syntax highlighting only,
; it is NOT for building the firmware for Linux.
; To build the firmware for Linux, please follow:
; https://openthings.freshdesk.com/support/solutions/articles/5000631599
[env:demo]
platform = native
build_flags =
	${env.build_flags}
	-DDEMO
